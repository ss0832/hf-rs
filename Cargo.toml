[package]
name = "hf-rs"
version = "0.3.2"
edition = "2024"
authors = ["ss0832"]
license = "Apache-2.0"
description = "Rust library for Hartree-Fock methods, HF variants and post-HF electron correlation, with analytic RHF/UHF nuclear derivatives through fourth order"

[lib]
name = "hf_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hf-rs"
path = "src/main.rs"
test = false

[dependencies]
rayon = "1.10"
libm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38", "generate-import-lib"] }
faer = "0.24.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3



