[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "hf-rs-python"
dynamic = ["version"]
description = "Pure Rust ab initio electronic structure engine for Hartree-Fock variants, post-HF electron correlation (MP2-MP8, CC, CI, CASSCF/CASPT2, F12, Selected CI, GASCI, DMRG, DSRG), and exact analytical nuclear derivatives up to 4th order"
authors = [{ name = "ss0832" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/basis_set_exchange/LICENSE"]
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
ase = ["ase"]

[project.scripts]
hf-rs = "hf_rs.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "hf_rs._hf_rs"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["embedded_basis", "hf_rs"]
